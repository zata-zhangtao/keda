<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1760" role="img" aria-label="iar pipeline: GitHub issue to pull request, detailed execution flow with recovery state machine">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .h { font-size: 13px; font-weight: 700; }
      .b { font-size: 11px; }
      .s { font-size: 10px; }
      .muted { fill: #64748b; }
      .arrowlabel { font-size: 10px; fill: #64748b; }
      .yes { font-size: 10px; fill: #16a34a; font-weight: 600; }
      .no { font-size: 10px; fill: #dc2626; font-weight: 600; }
      .phaseh { font-size: 12px; font-weight: 700; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#475569"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="an" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#dc2626"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#7c3aed"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#ea580c"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#2563eb"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <clipPath id="loopClip"><rect x="30" y="560" width="920" height="610" rx="12"/></clipPath>
  </defs>

  <!-- Title -->
  <text x="490" y="36" text-anchor="middle" class="title">iar · From GitHub Issue to Pull Request（详细执行流）</text>
  <text x="490" y="60" text-anchor="middle" class="subtitle">daemon 120s 轮询 · 每任务独占 worktree · recovery 状态机 + 跨 agent fallback · pre-PR review + post-PR supervisor</text>

  <!-- Legend -->
  <g>
    <rect x="40" y="80" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="66" y="94" class="b" fill="#374151">Daemon</text>
    <rect x="200" y="80" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="226" y="94" class="b" fill="#374151">Runner action</text>
    <rect x="360" y="80" width="18" height="18" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/><text x="386" y="94" class="b" fill="#374151">AI Agent</text>
    <rect x="520" y="80" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="546" y="94" class="b" fill="#374151">Success</text>
    <rect x="680" y="80" width="18" height="18" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="706" y="94" class="b" fill="#374151">Recovery</text>
    <polygon points="849,80 867,89 849,98 831,89" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/><text x="876" y="94" class="b" fill="#374151">Decision</text>
  </g>

  <!-- ============ Band A: Discovery ============ -->
  <g filter="url(#sh)">
    <rect x="40" y="120" width="280" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="180" y="146" text-anchor="middle" class="h" fill="#78350f">iar daemon（轮询）</text>
  <text x="180" y="166" text-anchor="middle" class="b" fill="#78350f">轮询 120s（run_interval_seconds）</text>
  <text x="180" y="184" text-anchor="middle" class="b" fill="#78350f">监控 .iar/registry 所有启用仓库</text>
  <text x="180" y="202" text-anchor="middle" class="s muted">iar run · iar run --all · iar daemon</text>

  <line x1="320" y1="166" x2="358" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="339" y="159" text-anchor="middle" class="arrowlabel">fetch</text>

  <g filter="url(#sh)">
    <rect x="360" y="120" width="280" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="500" y="146" text-anchor="middle" class="h" fill="#7f1d1d">发现 ready / rework-prd Issues</text>
  <text x="500" y="166" text-anchor="middle" class="b" fill="#7f1d1d">label: agent/ready</text>
  <text x="500" y="184" text-anchor="middle" class="b" fill="#7f1d1d">label: agent/rework-prd</text>
  <text x="500" y="202" text-anchor="middle" class="s muted">PRD / spec / bug 描述</text>

  <line x1="640" y1="166" x2="678" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="659" y="159" text-anchor="middle" class="arrowlabel">dispatch</text>

  <g filter="url(#sh)">
    <rect x="680" y="120" width="280" height="92" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="820" y="146" text-anchor="middle" class="h" fill="#1e3a8a">调度三条处理路径</text>
  <text x="820" y="166" text-anchor="middle" class="b" fill="#1e3a8a">过滤 dependency-blocked · max_issues 限流</text>
  <text x="820" y="184" text-anchor="middle" class="b" fill="#1e3a8a">ready(全新) / rework(修复) / publish-recovery(复用)</text>
  <text x="820" y="202" text-anchor="middle" class="s muted">_process_ready_issue（下图主路径）</text>

  <!-- dispatch -> claim (L-bend to claim center) -->
  <path d="M 820 212 L 820 224 L 490 224 L 490 236" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============ Band B: Claim ============ -->
  <g filter="url(#sh)">
    <rect x="190" y="238" width="600" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="262" text-anchor="middle" class="h" fill="#1e3a8a">Claim · agent/ready -> agent/running（workflow labels 互斥）</text>
  <text x="490" y="282" text-anchor="middle" class="b" fill="#1e3a8a">评论 Host / PID / Agent / started_at + claim marker · .iar/registry 持久化</text>
  <text x="490" y="300" text-anchor="middle" class="s muted">transition_issue_workflow_state 保留非 workflow labels（agent 路由 / task-group）</text>

  <line x1="490" y1="312" x2="490" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============ Band C: Worktree ============ -->
  <g filter="url(#sh)">
    <rect x="120" y="336" width="740" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="360" text-anchor="middle" class="h" fill="#1e3a8a">Prepare Worktree · .iar-worktrees/issue-N · branch issue-N</text>
  <text x="150" y="382" class="b" fill="#1e3a8a">• create_command -> reuse_command -> path_command（三段式取 canonical 路径）</text>
  <text x="150" y="400" class="b" fill="#1e3a8a">• 恢复 gitignore 制品：复制 .env* · provision worktree DB · install/symlink node_modules</text>
  <text x="150" y="418" class="b" fill="#1e3a8a">• _ensure_worktree_branch(issue-N) · _reconcile_worktree_with_remote_branch · ensure_evidence_dir_excluded</text>
  <text x="150" y="434" class="s muted">原子锁 _SHARED_GIT_LOCK 串行化 worktree add；长 agent 运行在锁外</text>

  <line x1="490" y1="440" x2="490" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============ Band D: Recovery-check diamond ============ -->
  <polygon points="490,462 590,500 490,538 390,500" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="490" y="496" text-anchor="middle" class="b" font-weight="600" fill="#713f12">已有可发布的</text>
  <text x="490" y="512" text-anchor="middle" class="b" font-weight="600" fill="#713f12">本地 commit？</text>

  <!-- No: down to agent loop -->
  <line x1="490" y1="538" x2="490" y2="558" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="553" class="no">No · 全新 / partial 续作</text>

  <!-- Yes: reuse curve to publication -->
  <path d="M 590 500 L 965 500 L 965 1282 L 560 1282 L 560 1288" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ay)"/>
  <text x="602" y="494" class="yes">Yes · 复用</text>
  <text x="972" y="760" class="arrowlabel" transform="rotate(-90 972 760)" text-anchor="middle">复用已有 commit · recovered=True · 不调用 agent</text>

  <!-- ============ Band E: Agent Execution Loop container ============ -->
  <rect x="30" y="560" width="920" height="610" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <g clip-path="url(#loopClip)">
    <rect x="30" y="560" width="920" height="32" fill="#1e293b"/>
  </g>
  <text x="490" y="581" text-anchor="middle" class="h" fill="#f8fafc">Agent Execution Loop · recovery 状态机（max_recovery_attempts 轮 · 跨 claim 续作）</text>

  <!-- Phase 1 -->
  <g filter="url(#sh)">
    <rect x="340" y="608" width="300" height="52" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="490" y="628" text-anchor="middle" class="phaseh" fill="#5b21b6">Phase 1 · Run Agent</text>
  <text x="490" y="646" text-anchor="middle" class="s" fill="#5b21b6">execution prompt（首跑）/ recovery prompt（携带失败上下文）· transient 就地重试（Level 1）</text>

  <line x1="490" y1="660" x2="490" y2="676" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Phase 2 -->
  <g filter="url(#sh)">
    <rect x="340" y="678" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="698" text-anchor="middle" class="phaseh" fill="#1e3a8a">Phase 2 · Verification</text>
  <text x="490" y="716" text-anchor="middle" class="s" fill="#1e3a8a">pre-commit · just test · verification_commands</text>

  <line x1="490" y1="730" x2="490" y2="738" stroke="#475569" stroke-width="2"/>

  <!-- diamond P2 -->
  <polygon points="490,738 580,766 490,794 400,766" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="490" y="770" text-anchor="middle" class="b" font-weight="600" fill="#713f12">验证通过？</text>
  <line x1="490" y1="794" x2="490" y2="810" stroke="#16a34a" stroke-width="2" marker-end="url(#ay)"/>
  <text x="500" y="806" class="yes">Yes</text>
  <!-- P2 No -> rail -->
  <line x1="400" y1="766" x2="150" y2="766" stroke="#ea580c" stroke-width="1.5"/>
  <text x="395" y="760" text-anchor="end" class="no">No</text>

  <!-- Phase 3 -->
  <g filter="url(#sh)">
    <rect x="340" y="812" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="832" text-anchor="middle" class="phaseh" fill="#1e3a8a">Phase 3 · PRD 交付</text>
  <text x="490" y="850" text-anchor="middle" class="s" fill="#1e3a8a">归档 pending PRD · acceptance checklist 全部完成态</text>

  <line x1="490" y1="864" x2="490" y2="872" stroke="#475569" stroke-width="2"/>

  <!-- diamond P3 -->
  <polygon points="490,872 580,900 490,928 400,900" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="490" y="904" text-anchor="middle" class="b" font-weight="600" fill="#713f12">交付就绪？</text>
  <line x1="490" y1="928" x2="490" y2="944" stroke="#16a34a" stroke-width="2" marker-end="url(#ay)"/>
  <text x="500" y="940" class="yes">Yes</text>
  <line x1="400" y1="900" x2="150" y2="900" stroke="#ea580c" stroke-width="1.5"/>
  <text x="395" y="894" text-anchor="end" class="no">No</text>

  <!-- Phase 3.5 -->
  <g filter="url(#sh)">
    <rect x="340" y="946" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="966" text-anchor="middle" class="phaseh" fill="#1e3a8a">Phase 3.5 · Validation 证据门禁 + 独立 verifier</text>
  <text x="490" y="984" text-anchor="middle" class="s" fill="#1e3a8a">evidence/commands 通过 · verifier red -> 本循环自动修复</text>
  <!-- P3.5 fail -> rail -->
  <line x1="340" y1="972" x2="150" y2="972" stroke="#ea580c" stroke-width="1.5"/>
  <text x="335" y="966" text-anchor="end" class="no">fail</text>

  <line x1="490" y1="998" x2="490" y2="1014" stroke="#16a34a" stroke-width="2" marker-end="url(#ay)"/>

  <!-- Phase 4 -->
  <g filter="url(#sh)">
    <rect x="340" y="1016" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="1036" text-anchor="middle" class="phaseh" fill="#1e3a8a">Phase 4 · Commit Proxy</text>
  <text x="490" y="1054" text-anchor="middle" class="s" fill="#1e3a8a">agent 写 commit-request.json · runner git add -A + staged 验证 + sanitize</text>

  <!-- Fix Agent (right) -->
  <line x1="640" y1="1042" x2="688" y2="1042" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="664" y="1036" text-anchor="middle" class="arrowlabel" fill="#7c3aed">staged 失败</text>
  <g filter="url(#sh)">
    <rect x="690" y="1016" width="240" height="52" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="810" y="1036" text-anchor="middle" class="phaseh" fill="#5b21b6">Fix Agent（轻量）</text>
  <text x="810" y="1054" text-anchor="middle" class="s" fill="#5b21b6">fix_timeout · 仅修当前 verification 失败</text>
  <!-- Fix success -> Phase 5 (enter from right, avoid crossing Phase 4) -->
  <path d="M 810 1068 L 810 1104 L 584 1104" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="700" y="1098" text-anchor="middle" class="yes">修复·commit</text>
  <!-- Fix fail -> rail (route up through 998-1016 corridor to the rail) -->
  <path d="M 810 1016 L 810 1006 L 150 1006" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <text x="805" y="1000" text-anchor="end" class="no">仍失败</text>
  <!-- line-jump ring: Fix fail jumps over the Phase 3.5->4 connector at (490,1006) -->
  <circle cx="490" cy="1006" r="3.5" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5"/>

  <line x1="490" y1="1068" x2="490" y2="1076" stroke="#475569" stroke-width="2"/>

  <!-- diamond P5 -->
  <polygon points="490,1076 582,1104 490,1132 398,1104" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="490" y="1100" text-anchor="middle" class="b" font-weight="600" fill="#713f12">产生 commit？</text>
  <text x="490" y="1114" text-anchor="middle" class="s" fill="#713f12">before_sha≠after_sha</text>
  <text x="390" y="1098" text-anchor="end" class="no">No</text>
  <line x1="398" y1="1104" x2="150" y2="1104" stroke="#ea580c" stroke-width="1.5"/>

  <!-- rail label -->
  <text x="128" y="900" class="arrowlabel" transform="rotate(-90 128 900)" text-anchor="middle" fill="#ea580c">verification / PRD / evidence / commit 失败 -> 汇集</text>

  <!-- rail: collect fails down to exhaustion diamond -->
  <line x1="150" y1="766" x2="150" y2="1192" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- success exit (P5 Yes) -> publication -->
  <text x="500" y="1148" class="yes">Yes</text>
  <path d="M 490 1132 L 490 1155 L 820 1155 L 820 1282 L 420 1282 L 420 1288" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ay)"/>

  <!-- ============ Exhaustion band ============ -->
  <polygon points="150,1192 250,1220 150,1248 50,1220" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="150" y="1216" text-anchor="middle" class="b" font-weight="600" fill="#713f12">max_recovery</text>
  <text x="150" y="1232" text-anchor="middle" class="b" font-weight="600" fill="#713f12">_attempts 耗尽？</text>

  <!-- No: retry arc back to Phase 1 -->
  <path d="M 50 1220 L 22 1220 L 22 634 L 338 634" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="44" y="1214" text-anchor="end" class="yes">No</text>
  <text x="14" y="900" class="arrowlabel" transform="rotate(-90 14 900)" text-anchor="middle" fill="#2563eb">未耗尽 · recovery prompt 重试（失败命令 + exit code + stdout/stderr）</text>

  <!-- Yes: fallback -->
  <text x="258" y="1214" class="no">Yes</text>
  <line x1="250" y1="1220" x2="278" y2="1220" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
  <g filter="url(#sh)">
    <rect x="280" y="1192" width="250" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="405" y="1214" text-anchor="middle" class="h" fill="#7c2d12">Level 2 · 跨 agent fallback</text>
  <text x="405" y="1232" text-anchor="middle" class="s" fill="#7c2d12">max_agent_switches 内切换 agent_fallback_order</text>
  <line x1="530" y1="1220" x2="558" y2="1220" stroke="#dc2626" stroke-width="2" marker-end="url(#an)"/>
  <g filter="url(#sh)">
    <rect x="560" y="1192" width="220" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="670" y="1214" text-anchor="middle" class="h" fill="#991b1b">全部耗尽</text>
  <text x="670" y="1232" text-anchor="middle" class="s" fill="#991b1b">checkpoint WIP commit · label agent/failed</text>
  <text x="670" y="1262" text-anchor="middle" class="s muted">blocked -> 人工解除 blocked_paths -> running 续作</text>

  <!-- ============ Publication band ============ -->
  <!-- Pub1 -->
  <g filter="url(#sh)">
    <rect x="280" y="1290" width="420" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="490" y="1312" text-anchor="middle" class="h" fill="#14532d">Step 0+1 · 蒸馏 skill(可选) + 评论 Implementation Complete</text>
  <text x="490" y="1330" text-anchor="middle" class="s" fill="#14532d">event marker implementation_complete · 验证结果 + attempt history</text>

  <line x1="490" y1="1348" x2="490" y2="1364" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pub2 push -->
  <g filter="url(#sh)">
    <rect x="280" y="1366" width="420" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="1388" text-anchor="middle" class="h" fill="#1e3a8a">Step 2 · push 实现 commit</text>
  <text x="490" y="1406" text-anchor="middle" class="s" fill="#1e3a8a">断言 PRD 已归档 · forbidden path 扫描 · evidence 排除 · remote 校验 · git push -u</text>

  <line x1="490" y1="1424" x2="490" y2="1440" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pub3 pre-PR review -->
  <g filter="url(#sh)">
    <rect x="280" y="1442" width="420" height="58" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="490" y="1464" text-anchor="middle" class="h" fill="#5b21b6">Step 3 · Pre-PR Review（push 之后、PR 之前）</text>
  <text x="490" y="1482" text-anchor="middle" class="s" fill="#5b21b6">reviewer agent + code-reviewer skill · 结构化 findings · 修复即时 push · 收敛</text>

  <line x1="490" y1="1500" x2="490" y2="1516" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pub4 draft PR -->
  <g filter="url(#sh)">
    <rect x="280" y="1518" width="420" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="1540" text-anchor="middle" class="h" fill="#1e3a8a">Step 4 · 创建 Draft PR</text>
  <text x="490" y="1558" text-anchor="middle" class="s" fill="#1e3a8a">生成 title/body + validation checklist · running->supervising · verifier 裁决 + 证据上传</text>

  <line x1="490" y1="1576" x2="490" y2="1592" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pub5 supervisor -->
  <g filter="url(#sh)">
    <rect x="280" y="1594" width="420" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="490" y="1616" text-anchor="middle" class="h" fill="#1e3a8a">Step 5 · Post-PR Supervisor（可选）</text>
  <text x="490" y="1634" text-anchor="middle" class="s" fill="#1e3a8a">监控冲突 / rebase / repair 循环 · 否则直接 -> agent/review</text>

  <line x1="490" y1="1652" x2="490" y2="1668" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

